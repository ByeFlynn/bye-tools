[package]
name = "byetools"
version = "0.1.0"
description = "ByeTools 本地优先开发者工具箱"
authors = ["ByeTools"]
edition = "2024"

[lib]
name = "byetools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.22.1"
futures-util = "0.3"
lapin = { version = "3.7.2", default-features = true }
keyring = "4.2.0"
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "ssl-vendored", "libz-static"] }
rocketmq = "5.0.0"
rumqttc = "0.25.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
